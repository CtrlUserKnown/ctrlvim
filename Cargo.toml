[workspace]
resolver = "2"
members = [
    "crates/ctrlvim-types",
    "crates/ctrlvim-text",
    "crates/ctrlvim-options",
    "crates/ctrlvim-regex",
    "crates/ctrlvim-editor",
    "crates/ctrlvim-vimscript",
    "crates/ctrlvim-treesitter",
    "crates/ctrlvim-markdown",
    "crates/ctrlvim-api-macro",
    "crates/ctrlvim-api",
    "crates/ctrlvim-lua",
    "crates/ctrlvim-async",
    "crates/ctrlvim-ai",
    "crates/ctrlvim-core",
    "crates/ctrlvim-tools",
    "crates/ctrlvim-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
ctrlvim-types = { path = "crates/ctrlvim-types" }
ctrlvim-text = { path = "crates/ctrlvim-text" }
ctrlvim-options = { path = "crates/ctrlvim-options" }
ctrlvim-regex = { path = "crates/ctrlvim-regex" }
ctrlvim-editor = { path = "crates/ctrlvim-editor" }
ctrlvim-vimscript = { path = "crates/ctrlvim-vimscript" }
ctrlvim-treesitter = { path = "crates/ctrlvim-treesitter" }
ctrlvim-markdown = { path = "crates/ctrlvim-markdown" }
ctrlvim-api-macro = { path = "crates/ctrlvim-api-macro" }
ctrlvim-api = { path = "crates/ctrlvim-api" }
ctrlvim-lua = { path = "crates/ctrlvim-lua" }
ctrlvim-async = { path = "crates/ctrlvim-async" }
ctrlvim-ai = { path = "crates/ctrlvim-ai" }
ctrlvim-core = { path = "crates/ctrlvim-core" }
ctrlvim-tools = { path = "crates/ctrlvim-tools" }

ratatui = "0.29"
crossterm = "0.28"
ropey = "1.6"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "net", "io-util", "macros"] }
rmpv = "1"
thiserror = "1"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# `cargo run` is how ctrlvim is developed, and an editor that stutters while you
# type is not testable. Almost all of the per-keystroke cost sits in
# dependencies — the tree-sitter grammars (C) and ropey — where an unoptimized
# build is 3-4x slower than a release one for no debugging benefit: nobody steps
# through a generated parser. Our own crates stay unoptimized so breakpoints and
# backtraces still work.
[profile.dev.package."*"]
opt-level = 2
