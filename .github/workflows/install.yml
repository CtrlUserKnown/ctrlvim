name: Install

# Exercises every documented `make install` path (README.md, Makefile) on
# real, non-deprecated GitHub-hosted runners, so a Makefile/Cargo change that
# breaks installing ctrlvim is caught before it reaches main.
#
# `cvi` is only invoked with `--version`/`--help` here — both return before
# the terminal is ever touched (see `main.rs`'s `Invocation::Print` branch) —
# a bare `cvi` would enter raw mode and block a headless runner forever.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Makefile"
      - "docs/config.example.toml"
      - "README.md"
      - ".github/workflows/install.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "Makefile"
      - "docs/config.example.toml"
      - "README.md"
      - ".github/workflows/install.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `sudo make install` / `make install PREFIX=...` / `make install
  # DESTDIR=...` / `make user-config`, on Linux and macOS (Apple Silicon).
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: sudo make install (default PREFIX=/usr/local)
        run: |
          set -eux
          sudo make install
          test -x /usr/local/bin/cvi
          /usr/local/bin/cvi --version
          /usr/local/bin/cvi --help >/dev/null
          test -f /usr/local/share/ctrlvim/config.example.toml
          test -f /usr/local/share/doc/ctrlvim/README.md

      - name: sudo make uninstall removes only what install placed
        run: |
          set -eux
          sudo make uninstall
          test ! -e /usr/local/bin/cvi
          test ! -e /usr/local/share/ctrlvim
          test ! -e /usr/local/share/doc/ctrlvim

      - name: make install PREFIX=~/.local (no root)
        run: |
          set -eux
          make install PREFIX="$HOME/.local"
          test -x "$HOME/.local/bin/cvi"
          "$HOME/.local/bin/cvi" --version
          test -f "$HOME/.local/share/ctrlvim/config.example.toml"

      - name: make uninstall PREFIX=~/.local
        run: |
          set -eux
          make uninstall PREFIX="$HOME/.local"
          test ! -e "$HOME/.local/bin/cvi"

      - name: make install DESTDIR=... (staged, for packaging)
        run: |
          set -eux
          make install DESTDIR="$RUNNER_TEMP/stage"
          test -x "$RUNNER_TEMP/stage/usr/local/bin/cvi"
          "$RUNNER_TEMP/stage/usr/local/bin/cvi" --version

      - name: make user-config seeds a config without clobbering an existing one
        run: |
          set -eux
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config" make user-config
          test -f "$RUNNER_TEMP/xdg-config/ctrlvim/config.toml"
          echo "# user-edited" >> "$RUNNER_TEMP/xdg-config/ctrlvim/config.toml"
          XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config" make user-config
          grep -q "# user-edited" "$RUNNER_TEMP/xdg-config/ctrlvim/config.toml"
