[package]
name = "ctrlvim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Ratatui frontend for the ctrlvim engine (startup dashboard + editor shell)"

[features]
default = []
# Build the local inference backend (candle + CodeGemma). Off by default: the
# `[ai]` config section is off by default too, so a stock `cvi` never loads a
# model — compiling one in cost every build minutes it did not need.
ai = ["ctrlvim-ai/local-model"]
# Forward candle's accelerator backends. Each implies `ai`. Off by default:
# CUDA needs a toolkit at build time and Metal only exists on macOS.
ai-cuda = ["ai", "ctrlvim-ai/cuda"]
ai-metal = ["ai", "ctrlvim-ai/metal"]

[dependencies]
ctrlvim-core.workspace = true
ctrlvim-ai.workspace = true
ctrlvim-markdown.workspace = true
ctrlvim-tools.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[[bin]]
name = "cvi"
path = "src/main.rs"
