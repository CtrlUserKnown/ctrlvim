[package]
name = "ctrlvim-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local code-completion inference for ctrlvim: CodeGemma-2B fill-in-the-middle on candle"

[features]
# The real backend, **off by default**. Inline suggestions are opt-in at
# runtime (`[ai] enabled = true`), so a default-on backend meant every build
# compiled candle and its whole dependency tree for a feature most users never
# switch on — minutes of build time, and on aarch64-apple-darwin an outright
# failure, since candle-core 0.11's NEON f16 path needs an unstable rustc
# feature (`stdarch_neon_f16`). Without this feature the crate still builds its
# prompt/plumbing layer and reports "no model" truthfully; turn it on with
# `cargo build -p ctrlvim --features ai`.
default = []
local-model = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:serde_json", "dep:rayon"]
# Accelerator backends, forwarded to candle. Neither is on by default: CUDA
# needs a toolkit present at build time and Metal only exists on macOS.
cuda = ["local-model", "candle-core?/cuda", "candle-nn?/cuda", "candle-transformers?/cuda"]
metal = ["local-model", "candle-core?/metal", "candle-nn?/metal", "candle-transformers?/metal"]

[dependencies]
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
serde_json = { version = "1", optional = true }
# Not used directly for parallelism — used to *contain* candle's. See
# `Completer`'s worker: inference otherwise saturates every core through the
# global rayon pool and starves the editor's own thread.
rayon = { version = "1.7", optional = true }
serde.workspace = true
